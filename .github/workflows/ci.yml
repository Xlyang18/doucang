name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci || npm install

      - name: 单元测试
        run: npm test

      - name: 冒烟测试
        run: npm run smoke

      - name: 构建渲染层
        run: npm run build
